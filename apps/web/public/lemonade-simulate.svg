<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Lemonade being poured over floating ice</title>
  <defs>
    <clipPath id="glass-clip">
      <path d="M31 43h66l-7 73a6 6 0 0 1-6 5H44a6 6 0 0 1-6-5z"/>
    </clipPath>
    <style>
      .outline { stroke: #211d14; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .lemonade { fill: #f7cf52; }
      .lemonade-light { fill: #f8d354; }
      .ice { fill: #fff9e4; stroke: #236f5e; stroke-width: 2; }
      .straw { fill: none; stroke: #e37a58; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .glass { fill: #fff9e4; fill-opacity: .18; }
      .glass-shine { fill: none; stroke: #fff9e4; stroke-width: 3; stroke-linecap: round; opacity: .82; }
      .lemon-rind { fill: #f7cf52; stroke: #211d14; stroke-width: 3; }
      .lemon-flesh { fill: #fff9e4; stroke: #211d14; stroke-width: 2; }
      .pour-stream { fill: #f7cf52; transform-box: fill-box; transform-origin: center bottom; animation: pour 2.8s ease-in-out infinite; }
      .liquid-surface { transform-box: fill-box; transform-origin: center; animation: slosh 2.2s ease-in-out infinite alternate; }
      .ice-float { transform-box: fill-box; transform-origin: center; animation: bob 1.8s ease-in-out infinite alternate; }
      .ice-float:nth-child(2) { animation-delay: -.55s; }
      .ice-float:nth-child(3) { animation-delay: -1.05s; }
      .straw-float { transform-box: fill-box; transform-origin: 50% 85%; animation: straw-float 2.1s ease-in-out infinite alternate; }
      .lemon-float { transform-box: fill-box; transform-origin: center; animation: lemon-float 2.5s ease-in-out infinite alternate; }

      @keyframes pour {
        0%, 12% { opacity: 0; transform: translateY(-7px) scaleY(.08); }
        23%, 68% { opacity: 1; transform: translateY(0) scaleY(1); }
        82%, 100% { opacity: 0; transform: translateY(6px) scaleY(.25); }
      }

      @keyframes slosh {
        from { transform: translateY(-1px) rotate(-.8deg); }
        to { transform: translateY(1px) rotate(.8deg); }
      }

      @keyframes bob {
        from { transform: translateY(-2px) rotate(-2deg); }
        to { transform: translateY(2px) rotate(2deg); }
      }

      @keyframes straw-float {
        from { transform: translateY(-1.5px) rotate(-1.4deg); }
        to { transform: translateY(1.5px) rotate(1.4deg); }
      }

      @keyframes lemon-float {
        from { transform: translateY(-1.5px) rotate(-3deg); }
        to { transform: translateY(1.5px) rotate(3deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pour-stream,
        .liquid-surface,
        .ice-float,
        .straw-float,
        .lemon-float {
          animation: none;
        }
      }
    </style>
  </defs>

  <path class="pour-stream" d="M58 0h12v51H58z"/>

  <g class="straw-float">
    <path class="straw" d="M40 8l17 13 17 79"/>
    <path class="outline" fill="none" d="M40 8l17 13" stroke-width="2"/>
  </g>

  <g class="lemon-float">
    <circle class="lemon-rind" cx="94" cy="35" r="25"/>
    <circle class="lemon-flesh" cx="94" cy="35" r="18"/>
    <path class="outline" fill="none" stroke-width="2" d="M94 17v36M76 35h36M81 22l26 26M107 22L81 48"/>
  </g>

  <g clip-path="url(#glass-clip)">
    <path class="lemonade" d="M28 61h72v65H28z"/>
    <path class="lemonade-light liquid-surface" d="M27 59c12-5 25 5 37 0s25 5 38 0v12H27z"/>

    <g aria-hidden="true">
      <g class="ice-float" transform="translate(42 69) rotate(-9)">
        <rect class="ice" width="22" height="18" rx="4"/>
      </g>
      <g class="ice-float" transform="translate(66 76) rotate(12)">
        <rect class="ice" width="20" height="17" rx="4"/>
      </g>
      <g class="ice-float" transform="translate(49 92) rotate(7)">
        <rect class="ice" width="21" height="17" rx="4"/>
      </g>
    </g>
  </g>

  <path class="glass outline" d="M31 43h66l-7 73a6 6 0 0 1-6 5H44a6 6 0 0 1-6-5z"/>
  <path class="outline" fill="none" d="M31 43h66"/>
  <path class="glass-shine" d="M39 51l5 54"/>
</svg>
