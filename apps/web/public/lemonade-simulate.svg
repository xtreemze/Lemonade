    <path class="lemon-highlight" d="M130.33239,33.33332a29.33131,29.33131,0,0,1,29.33028,29.16573c.00031-.05564.00212-.11094.00212-.16666a29.33239,29.33239,0,0,0-58.66478,0c0,.05572.00181.111.00212.16666A29.33131,29.33131,0,0,1,130.33239,33.33332Z" transform="translate(-33.38623 -33)"/>
  </g>

  <path id="glassBottom" class="glass-bottom" d="M130.92,56H62.22269a3.50343,3.50343,0,0,0-3.49086,3.79993l8.32322,97.99315A3.50343,3.50343,0,0,0,70.54591,161h52.05088a3.50343,3.50343,0,0,0,3.49086-3.20692l8.32322-97.99315A3.50343,3.50343,0,0,0,130.92,56Z" transform="translate(-33.38623 -33)"/>

  <g clip-path="url(#glass-clip)">
    <polygon id="lemonade2" class="lemonade-back" points="94.773 52 31.597 52 37.77 123 88.6 123 94.773 52"/>

    <g class="ice-float">
      <rect id="cube5" class="ice-a" x="69.07319" y="82.27176" width="27.1286" height="26.29021" rx="4.99124" ry="4.99124" transform="translate(-4.38776 -51.84682) rotate(15.74793)"/>
    </g>
    <g class="ice-float">
      <rect id="cube1" class="ice-a" x="95.52033" y="107.91024" width="25.01526" height="23.75643" rx="4.5835" ry="4.5835" transform="matrix(0.93181, 0.36294, -0.36294, 0.93181, 17.45556, -64.03945)"/>
    </g>


    <g class="ice-float">
      <rect id="cube4" class="ice-b" x="101.63709" y="86.66835" width="22.9414" height="21.78693" rx="4.5835" ry="4.5835" transform="translate(-56.75148 3.84287) rotate(-16.7946)"/>
    </g>
    <g class="ice-float">
      <rect id="cube3" class="ice-c" x="84.2982" y="81.54597" width="25.96708" height="23.64391" rx="4.5835" ry="4.5835" transform="translate(-17.52694 -47.11087) rotate(9.02966)"/>
    </g>
    <g class="ice-float">
      <rect id="cube2" class="ice-d" x="72.78349" y="106.18773" width="23.40123" height="23.40123" rx="4.5835" ry="4.5835" transform="translate(36.87666 -59.44801) rotate(30)"/>
    </g>

    <polygon id="lemonade1" class="lemonade-front liquid-surface" points="94.773 52 31.597 52 37.77 123 88.6 123 94.773 52"/>
  </g>


  <g id="straw" class="straw-float">
