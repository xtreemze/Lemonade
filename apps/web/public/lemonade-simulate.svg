<svg id="Lemonade" xmlns="http://www.w3.org/2000/svg" width="126.61377" height="128" viewBox="0 0 126.61377 128">
  <defs>
    <style>
      .cls-1 {
        fill: #ffe424;
      }

      .cls-2 {
        fill: #fff543;
      }

      .cls-3 {
        opacity: 0.58;
      }

      .cls-14, .cls-22, .cls-4, .cls-8 {
        fill: #fff;
      }

      .cls-5 {
        opacity: 0.05;
      }

      .cls-6 {
        fill: #2a6e8c;
      }

      .cls-7 {
        fill: #0b3144;
      }

      .cls-13, .cls-20, .cls-7, .cls-8 {
        opacity: 0.2;
      }

      .cls-9 {
        fill: #aeffff;
        opacity: 0.78;
      }

      .cls-10 {
        fill: #e8b06a;
        opacity: 0.5;
      }

      .cls-11 {
        fill: #e9f4e9;
      }

      .cls-11, .cls-15, .cls-16, .cls-17 {
        opacity: 0.91;
      }

      .cls-12 {
        fill: #ff551d;
      }

      .cls-13 {
        fill: #18407a;
      }

      .cls-14 {
        opacity: 0.07;
      }

      .cls-15 {
        fill: #e8efe8;
      }

      .cls-16 {
        fill: #f3fff3;
      }

      .cls-17 {
        fill: #e3e8e3;
      }

      .cls-18 {
        fill: #efff00;
        opacity: 0.53;
      }

      .cls-19 {
        fill: #66b3e3;
        opacity: 0.04;
      }

      .cls-20 {
        fill: #2d6566;
      }

      .cls-21 {
        fill: #267391;
        opacity: 0.09;
      }

      .cls-22 {
        opacity: 0.15;
      }

      #Lemon {
        transform-box: fill-box;
        transform-origin: center;
        animation: lemon-float 2.8s ease-in-out infinite alternate;
      }

      #Straw {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: straw-bob 2.2s ease-in-out infinite alternate;
      }

      #lemonade1 {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: lemonade-pour 2.6s ease-in-out infinite;
      }

      #lemonade2 {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: lemonade-slosh 2.6s ease-in-out infinite;
      }

      #cube1,
      #cube2,
      #cube3,
      #cube4,
      #cube5 {
        transform-box: fill-box;
        transform-origin: center;
        animation: ice-bob 1.8s ease-in-out infinite alternate;
      }

      #cube2,
      #cube4 {
        animation-delay: -0.7s;
      }

      @keyframes lemonade-pour {
        0%,
        12% {
          transform: scaleY(0.14) translateY(28%);
          opacity: 0.55;
        }
        48% {
          transform: scaleY(0.78) translateY(5%);
          opacity: 0.9;
        }
        70%,
        100% {
          transform: scaleY(1) translateY(0);
          opacity: 1;
        }
      }

      @keyframes lemonade-slosh {
        0%,
        100% {
          transform: rotate(-1.4deg) scaleY(0.98);
        }
        50% {
          transform: rotate(1.4deg) scaleY(1.02);
        }
      }

      @keyframes ice-bob {
        from {
          transform: translateY(-1.8px) rotate(-2deg);
        }
        to {
          transform: translateY(2px) rotate(2deg);
        }
      }

      @keyframes lemon-float {
        from {
          transform: translateY(-1px) rotate(-3deg);
        }
        to {
          transform: translateY(2px) rotate(3deg);
        }
      }

      @keyframes straw-bob {
        from {
          transform: rotate(-1.5deg);
        }
        to {
          transform: rotate(1.5deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #Lemon,
        #Straw,
        #lemonade1,
        #lemonade2,
        #cube1,
        #cube2,
        #cube3,
        #cube4,
        #cube5 {
          animation: none;
        }
      }
    </style>
  </defs>
