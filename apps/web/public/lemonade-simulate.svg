<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126.61377 128">
  <title>Lemonade being poured into the original glass over floating ice</title>
  <defs>
    <clipPath id="glass-clip" clipPathUnits="userSpaceOnUse">
      <path d="M130.92,56H62.22269a3.50343,3.50343,0,0,0-3.49086,3.79993l8.32322,97.99315A3.50343,3.50343,0,0,0,70.54591,161h52.05088a3.50343,3.50343,0,0,0,3.49086-3.20692l8.32322-97.99315A3.50343,3.50343,0,0,0,130.92,56Z" transform="translate(-33.38623 -33)"/>
    </clipPath>
    <style>
      .lemon-rind { fill: #ffe424; }
      .lemon-flesh { fill: #fff543; }
      .lemon-detail { fill: #fff; opacity: .58; }
      .lemon-shadow { fill: #2a6e8c; opacity: .05; }
      .lemon-edge-shade { fill: #0b3144; opacity: .2; }
      .lemon-highlight { fill: #fff; opacity: .2; }
      .glass-bottom { fill: #aeffff; opacity: .78; }
      .lemonade-back { fill: #e8b06a; opacity: .5; }
      .lemonade-front { fill: #efff00; opacity: .53; }
      .ice-a { fill: #e9f4e9; opacity: .91; }
      .ice-b { fill: #e8efe8; opacity: .91; }
      .ice-c { fill: #f3fff3; opacity: .91; }
      .ice-d { fill: #e3e8e3; opacity: .91; }
      .straw-main { fill: #ff551d; }
      .straw-shade { fill: #18407a; opacity: .2; }
      .straw-highlight { fill: #fff; opacity: .07; }
      .glass-face { fill: #66b3e3; opacity: .04; }
      .glass-shadow { fill: #2d6566; opacity: .2; }
      .glass-side { fill: #267391; opacity: .09; }
      .glass-highlight { fill: #fff; opacity: .15; }

      .liquid-surface {
        transform-box: fill-box;
        transform-origin: center;
        animation: slosh 2.2s ease-in-out infinite alternate;
      }

      .ice-float {
        transform-box: fill-box;
        transform-origin: center;
        animation: bob 1.8s ease-in-out infinite alternate;
      }

      .ice-float:nth-of-type(2) { animation-delay: -.35s; }
      .ice-float:nth-of-type(3) { animation-delay: -.7s; }
      .ice-float:nth-of-type(4) { animation-delay: -1.05s; }
      .ice-float:nth-of-type(5) { animation-delay: -1.4s; }

      .straw-float {
        transform-box: fill-box;
        transform-origin: 50% 85%;
        animation: straw-float 2.1s ease-in-out infinite alternate;
      }

      .lemon-float {
        transform-box: fill-box;
        transform-origin: center;
        animation: lemon-float 2.5s ease-in-out infinite alternate;
      }

      @keyframes slosh {
        from { transform: translateY(-1px) rotate(-.55deg); }
        to { transform: translateY(1px) rotate(.55deg); }
      }

      @keyframes bob {
        from { transform: translateY(-1.8px) rotate(-1.6deg); }
        to { transform: translateY(1.8px) rotate(1.6deg); }
      }

      @keyframes straw-float {
        from { transform: translateY(-1.25px) rotate(-1deg); }
        to { transform: translateY(1.25px) rotate(1deg); }
      }

      @keyframes lemon-float {
        from { transform: translateY(-1.2px) rotate(-2deg); }
        to { transform: translateY(1.2px) rotate(2deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .liquid-surface,
        .ice-float,
        .straw-float,
        .lemon-float {
          animation: none;
        }
      }
    </style>
  </defs>

  <g id="lemon" class="lemon-float">
    <circle class="lemon-rind" cx="97.11377" cy="29.5" r="29.5"/>
    <circle class="lemon-flesh" cx="97.11377" cy="29.5" r="23.5"/>
    <g class="lemon-detail">
