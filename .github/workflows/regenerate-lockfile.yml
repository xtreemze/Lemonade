name: regenerate lockfile

on:
  push:
    branches: [revival/native-platform-cleanup]
    paths:
      - .github/workflows/regenerate-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: false
          install: false
      - name: Regenerate workspace lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: regenerate clean pnpm lockfile"
          git push
