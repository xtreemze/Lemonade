name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify showcase contracts
        run: pnpm test:showcase-contract

      - name: Capture source-quality showcase media
        run: pnpm showcase:capture

      - name: Render showcase videos, graphics, and reels
        run: pnpm showcase:render

      - name: Verify showcase media
        run: pnpm showcase:verify

      - name: Build project-page bundle
        run: pnpm --filter @lemonade/web exec vite build --base=/Lemonade/

      - name: Publish showcase into Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/dist/showcase/desktop
          mkdir -p apps/web/dist/showcase/mobile
          mkdir -p apps/web/dist/showcase/videos/desktop
          mkdir -p apps/web/dist/showcase/videos/mobile
          mkdir -p apps/web/dist/showcase/reels
          cp artifacts/e2e-media/graphics/desktop/* apps/web/dist/showcase/desktop/
          cp artifacts/e2e-media/graphics/mobile/* apps/web/dist/showcase/mobile/
          cp artifacts/e2e-media/videos/desktop/*.mp4 apps/web/dist/showcase/videos/desktop/
          cp artifacts/e2e-media/videos/mobile/*.mp4 apps/web/dist/showcase/videos/mobile/
          cp artifacts/e2e-media/reels/* apps/web/dist/showcase/reels/

      - name: Verify deployment bundle
        run: pnpm --filter @lemonade/web verify:pages-bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
