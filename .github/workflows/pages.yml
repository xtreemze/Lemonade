name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ["Visual Showcase"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment source
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.source.outputs.should_deploy }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Resolve source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$TRIGGER_CONCLUSION" != "success" ]; then
            echo "Visual Showcase did not succeed; skipping Pages deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            master_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if [ "$TRIGGER_SHA" != "$master_sha" ]; then
              echo "Showcase commit $TRIGGER_SHA is no longer current master ($master_sha); refusing to roll Pages back."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "source_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build Pages artifact
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project-page bundle
        run: pnpm --filter @lemonade/web exec vite build --base=/Lemonade/

      - name: Restore certified showcase artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHOWCASE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/e2e-media
          mkdir -p artifacts/e2e-media

          run_id="$SHOWCASE_RUN_ID"
          require_current=false
          if [ -n "$run_id" ]; then
            require_current=true
            echo "Using certified showcase artifact from triggering run $run_id."
          else
            run_id="$(gh run list \
              --workflow "Visual Showcase" \
              --commit "$SOURCE_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi

          if [ -z "$run_id" ]; then
            echo "No certified showcase artifact exists for $SOURCE_SHA; deploying the application without showcase media."
            rm -rf artifacts/e2e-media
            exit 0
          fi

          if ! gh run download "$run_id" --name lemonade-showcase-latest --dir artifacts/e2e-media; then
            if [ "$require_current" = true ]; then
              echo "Successful triggering showcase run $run_id did not expose lemonade-showcase-latest."
              exit 1
            fi
            echo "Latest certified showcase artifact could not be restored; continuing with the application build."
            rm -rf artifacts/e2e-media
            exit 0
          fi

      - name: Publish showcase into Pages bundle when available
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "artifacts/e2e-media/graphics/desktop"
            "artifacts/e2e-media/graphics/mobile"
            "artifacts/e2e-media/videos/desktop"
            "artifacts/e2e-media/videos/mobile"
            "artifacts/e2e-media/reels"
          )

          for required_path in "${required_paths[@]}"; do
            if [ ! -d "${required_path}" ]; then
              echo "Showcase artifact is unavailable or incomplete; deploying without a showcase refresh."
              exit 0
            fi
          done

          mkdir -p apps/web/dist/showcase/desktop
          mkdir -p apps/web/dist/showcase/mobile
          mkdir -p apps/web/dist/showcase/videos/desktop
          mkdir -p apps/web/dist/showcase/videos/mobile
          mkdir -p apps/web/dist/showcase/reels
          cp artifacts/e2e-media/graphics/desktop/* apps/web/dist/showcase/desktop/
          cp artifacts/e2e-media/graphics/mobile/* apps/web/dist/showcase/mobile/
          cp artifacts/e2e-media/videos/desktop/*.mp4 apps/web/dist/showcase/videos/desktop/
          cp artifacts/e2e-media/videos/mobile/*.mp4 apps/web/dist/showcase/videos/mobile/
          cp artifacts/e2e-media/reels/* apps/web/dist/showcase/reels/

      - name: Verify deployment bundle
        run: pnpm --filter @lemonade/web verify:pages-bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
