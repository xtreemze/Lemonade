name: Tooling Migration Autofix

on:
  push:
    branches:
      - chore/strict-biome-vite-tooling

permissions:
  contents: write

jobs:
  generate-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Regenerate dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Apply Biome fixes
        run: pnpm exec biome check --write --unsafe --max-diagnostics=10000 . || true
      - name: Commit generated cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply generated tooling cleanup"
          git push origin HEAD:${{ github.ref_name }}
