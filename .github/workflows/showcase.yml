name: Visual Showcase

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/scene/**"
      - "packages/ui/**"
      - "e2e/**"
      - "scripts/**"
      - "playwright*.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/showcase.yml"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "docs/showcase.md"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/scene/**"
      - "packages/ui/**"
      - "e2e/**"
      - "scripts/**"
      - "playwright*.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/showcase.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-showcase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: Record and render showcase
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify showcase contracts
        id: contracts
        run: pnpm test:showcase-contract

      - name: Capture source-quality scene video and static screenshots
        id: capture
        run: pnpm showcase:capture

      - name: Render source-resolution reels and presentation graphics
        id: render
        run: pnpm showcase:render

      - name: Verify resolution, frame rate, and presentation payloads
        id: verify
        run: pnpm showcase:verify

      - name: Upload verified visual evidence
        if: ${{ always() && steps.contracts.outcome == 'success' && steps.capture.outcome == 'success' && steps.render.outcome == 'success' && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lemonade-showcase-latest
          path: artifacts/e2e-media
          if-no-files-found: error
          retention-days: 14

      - name: Summarize showcase result
        if: always()
        shell: bash
        run: |
          {
            echo "### Visual Showcase"
            echo
            echo "This workflow is informational and does not block CI or deployment."
            echo
            echo "- Contracts: ${{ steps.contracts.outcome }}"
            echo "- Capture: ${{ steps.capture.outcome }}"
            echo "- Render: ${{ steps.render.outcome }}"
            echo "- Verification: ${{ steps.verify.outcome }}"
          } >> "${GITHUB_STEP_SUMMARY}"
